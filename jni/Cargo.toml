[package]
name = "unitytranslatelib"
version = "2.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ct2rs = "0.10.1"
jni = "0.22.4"
rust_tokenizers = "8.1.1"
anyhow = "1.0.104"
regex = { version = "1.13.1", features = ["unicode-perl"] }

[features]
accelerate = ["ct2rs/accelerate"]
