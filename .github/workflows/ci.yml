name: Gradle CI

on:
  - push

permissions:
  contents: read

jobs:
  build-linux:
    environment: UnityTranslate Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      # Taken from https://github.com/CaffeineMC/sodium-fabric/blob/1.19.3/dev/.github/workflows/gradle.yml
      - name: Cache/Uncache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build artifacts
        run: ./gradlew :native:jar
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux x86-64 Natives
          path: native/build/libs/UnityTranslateLib-*.jar
  build-linux-arm64:
