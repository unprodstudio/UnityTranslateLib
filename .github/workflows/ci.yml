      - name: Build artifacts
        run: ./gradlew :native:jar
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS arm64 Targets
          path: native/target/*
      #    name: macOS arm64 Natives
      #    path: native/build/libs/UnityTranslateLib-*.jar
